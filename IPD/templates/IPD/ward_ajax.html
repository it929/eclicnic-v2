{% extends 'admin.html' %}

{% block content %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
    .form-grid {
        display: grid;
        grid-template-columns: 4fr 1fr;
        padding-bottom: -10px;
        gap: 10px;
        width: 50%;
        }
    .form-grid2 {
        display: grid;
        grid-template-columns: 3fr 1fr;
        padding-bottom: -10px;
        gap: 10px;
        width: 50%;
        }
</style>
<div class="container-fluid">
    <h1 class="h3 mb-1 text-gray-800 font-weight-bold" style="color: rgb(42, 41, 41);"><i class="fa fa-plus"></i> &nbsp;Add / Update Ward (Room)  </h1>
  <p></p>
  <hr style="margin-top: -5px;">
<div style="margin-top: -5px;">
    <input type="hidden" id="ward_id">
    <div>
        <label>Ward / Room Name:</label>
        <input type="text" id="ward_name" placeholder="Ward / Room Name" class="form-control">
    </div>

    <div style="margin-top: 10px;">
        <label>Price (per day):</label>
        <input type="number" id="price" placeholder="Enter price" min="0" value="0" class="form-control">
    </div>

    <div style="margin-top: 10px;">
        <button onclick="saveWard()" class="btn btn-primary">Save Ward <i class="fa fa-save"></i></button>
    </div>


    <button onclick="clearForm()" id="cancelBtn" style="display:none; height:37px; border-radius: 5px; width:122px; margin-top:5px; border:none; background:#ccc; color:#fff">Cancel</button>

    <hr>

    <h3 class="h3 mb-1 text-gray-800 font-weight-bold" style="color: rgb(42, 41, 41);"><i class="fa fa-upload"></i> &nbsp;Upload Ward from Excel  </h3>
    <p></p>
    <hr style="margin-top: -5px;">
    <div class="form-grid2">
        <input type="file" id="excel_file" class="form-control">
        <button onclick="uploadExcel()" class="btn btn-primary">Upload <i class="fa fa-upload"></i></button>
        <div id="uploadMessage"></div>
    </div>

    <hr>

    <h3 class="h3 mb-1 text-gray-800 font-weight-bold" style="color: rgb(42, 41, 41);"><i class="fa fa-list"></i> &nbsp;Ward List  </h3>
    <p></p>
    <hr style="margin-top: -5px;">

    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                <tr>
                    <th>Name</th>
                    <th>Price (per day)</th>
                    <th>Actions</th>
                </tr>

                {% for ward in wards %}
                <tr id="row{{ ward.id }}">
                    <td>{{ ward.ward_name }}</td>
                    <td>₦ {{ ward.price|floatformat:0 }}</td>
                    <td>
                        <button onclick="editWard('{{ ward.id }}','{{ ward.ward_name }}')" class="btn btn-warning btn-sm">Edit <i class="fa fa-pencil"></i></button>
                        <button onclick="deleteWard('{{ ward.id }}')" class=" btn btn-danger btn-sm">Delete <i class="fa fa-trash"></i></button>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

</div>

<script>
function saveWard() {
    let wardName = $('#ward_name').val().trim();
    let price = $('#price').val();
    
    if (!wardName) {
        alert('Please enter ward name');
        return;
    }
    
    // Validate price
    if (price === '' || isNaN(price) || price < 0) {
        alert('Please enter a valid price (0 or greater)');
        return;
    }
    
    let id = $('#ward_id').val();
    let url = id ? `/wards/update/${id}/` : '/wards/create/';

    $.post(url, {
        ward_name: wardName,
        price: price,
        csrfmiddlewaretoken: '{{ csrf_token }}'
    }, function(response) {
        if (response.status === 'error') {
            alert(response.message);
        } else {
            clearForm();
            location.reload();
        }
    }).fail(function(xhr) {
        let response = xhr.responseJSON;
        alert(response?.message || 'Error saving ward');
    });
}

function editWard(id, name, price) {
    $('#ward_id').val(id);
    $('#ward_name').val(name);
    $('#price').val(price);
    $('button[onclick="saveWard()"]').text('Update Ward');

    // Scroll to the input field or change button text
    $('#ward_name').focus();
    $('button[onclick^="saveWard"]').text('Update Ward');

    // Show cancel button if you have one
    if ($('#cancelBtn').length) {
        $('#cancelBtn').show();
    }
}

function deleteWard(id) {
    if(confirm("Delete this ward?")){
        $.post(`/wards/delete/${id}/`, {
            csrfmiddlewaretoken: '{{ csrf_token }}'
        }, function(){
            $('#row'+id).remove();
        }).fail(function() {
            alert('Error deleting ward');
        });
    }
}

function clearForm() {
    $('#ward_id').val('');
    $('#ward_name').val('');
    $('#price').val('0');
    $('button[onclick="saveWard()"]').text('Save Ward');
    
    if ($('#cancelBtn').length) {
        $('#cancelBtn').hide();
    }
}

function uploadExcel() {
    let fileInput = $('#excel_file')[0];
    if (!fileInput.files.length) {
        alert('Please select an Excel file');
        return;
    }
    
    let data = new FormData();
    data.append('excel_file', fileInput.files[0]);
    data.append('csrfmiddlewaretoken', '{{ csrf_token }}');

    $('#uploadMessage').html('Uploading...').css('color', 'blue');
    
    $.ajax({
        url: '/wards/upload-excel/',
        method: 'POST',
        data: data,
        processData: false,
        contentType: false,
        success: function(response){
            let message = response.message || 'Upload complete!';
            $('#uploadMessage').html(message).css('color', 'green');
            
            if (response.errors) {
                let errorHtml = '<br><small>Errors: ' + response.errors.join(', ') + '</small>';
                $('#uploadMessage').append(errorHtml);
            }
            
            setTimeout(() => location.reload(), 1500);
        },
        error: function(xhr){
            let message = xhr.responseJSON?.message || 'Upload failed';
            $('#uploadMessage').html('Error: ' + message).css('color', 'red');
        }
    });
}

// Optional: Add cancel button functionality
$(document).ready(function() {
    // Add cancel button if it doesn't exist
    if (!$('#cancelBtn').length) {
        $('button[onclick="saveWard()"]').after('<button id="cancelBtn" onclick="clearForm()" >Cancel</button>');
    }
});
</script>

{% endblock content %}
