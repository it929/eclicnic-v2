# Clinic365 EMR - nginx site.
# Serves the built React app and passes the Django paths to gunicorn (deploy/systemd/clinic365.service).
# Install:  sudo cp deploy/nginx/clinic365.conf /etc/nginx/sites-available/clinic365
#           sudo ln -s /etc/nginx/sites-available/clinic365 /etc/nginx/sites-enabled/clinic365
#           sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx

upstream clinic365_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    # Must match DJANGO_ALLOWED_HOSTS in /etc/clinic365/clinic365.env
    server_name 192.168.2.14 localhost;

    # Excel imports, patient documents and scans
    client_max_body_size 25m;

    # Built React app: `npm run build` in frontend/, then copy frontend/dist/ here.
    root /opt/clinic365/frontend;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # ---- Django ------------------------------------------------------------
    location /api/ {
        proxy_pass http://clinic365_app;
        include /etc/nginx/proxy_params;          # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;                  # bulk imports and reports
    }
    # Case-note pages opened inside the app (iframe / print)
    location ~ ^/(case_note|filtered_case_note)/ {
        proxy_pass http://clinic365_app;
        include /etc/nginx/proxy_params;
    }
    # Health check for monitoring (returns 200 when Django is up)
    location = /health {
        proxy_pass http://clinic365_app;
        include /etc/nginx/proxy_params;
        access_log off;
    }
    # Django admin (optional: restrict to the IT office, e.g. "allow 192.168.2.0/24; deny all;")
    location /admin/ {
        proxy_pass http://clinic365_app;
        include /etc/nginx/proxy_params;
    }

    # Django static files (collectstatic -> DJANGO_STATIC_ROOT)
    location /static/ {
        alias /opt/clinic365/staticfiles/;
        expires 30d;
        access_log off;
    }
    # Uploaded files (lab results, scans, photos): Django checks the user is signed in, then
    # answers with X-Accel-Redirect so nginx sends the file from the internal location below.
    location /media/ {
        proxy_pass http://clinic365_app;
        include /etc/nginx/proxy_params;
        client_max_body_size 1m;
    }
    # Not reachable from a browser directly (`internal`); only via Django's X-Accel-Redirect.
    location /protected-media/ {
        internal;
        alias /opt/clinic365/media/;           # = DJANGO_MEDIA_ROOT
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---- React app -----------------------------------------------------------
    # Fingerprinted build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    # Everything else is the single-page app (it routes with #/...). index.html is never cached,
    # so a new release is picked up on the next page load.
    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            # (add_header here replaces the server-level ones, so repeat them)
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }
    }
}
