{% extends 'admin.html' %}
{% block content %}
<style>
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        padding-bottom: -10px;
        gap: 10px;
        font-size: 14px;
    }
</style>
<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800 font-weight-bold">
        <i class="fa fa-user-plus"></i> &nbsp;Billing Invoice Listing Report
    </h1>
    <hr>
    <form method="get" id="reportForm">
        <div class="form-grid">
            <div>
                <div>
                    <label>Date From <span class="text-danger">*</span></label>
                    <input type="date" name="date_from" class="form-control" value="{{ request.GET.date_from }}" required>
                </div>
                <div>
                    <label>Date To</label>
                    <input type="date" name="date_to" class="form-control" value="{{ request.GET.date_to }}">
                </div>
                <div>
                    <label>Sponsor</label>
                    <select name="sponsor" class="form-control">
                        <option value="">All</option>
                        {% for s in sponsors %}<option value="{{ s.id }}" {% if request.GET.sponsor == s.id|stringformat:"s" %}selected{% endif %}>{{ s.plan }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Patient Type</label>
                    <select name="patient_type" class="form-control">
                        <option value="">All</option>
                        {% for pt in patient_types %}<option value="{{ pt.id }}" {% if request.GET.patient_type == pt.id|stringformat:"s" %}selected{% endif %}>{{ pt.category }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Transaction Type</label>
                    <select name="transaction_type" class="form-control">
                        {% for tt in transaction_types %}<option value="{{ tt }}" {% if request.GET.transaction_type == tt %}selected{% endif %}>{{ tt }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label>Payment Type</label>
                    <select name="payment_type" class="form-control">
                        <option value="">All</option>
                        {% for pt in payment_types %}<option value="{{ pt }}" {% if request.GET.payment_type == pt %}selected{% endif %}>{{ pt }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Billing Officer</label>
                    <select name="billing_officer" class="form-control">
                        <option value="">All</option>
                        {% for bo in billing_officers %}<option value="{{ bo.id }}" {% if request.GET.billing_officer == bo.id|stringformat:"s" %}selected{% endif %}>{{ bo.fullname }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Orientation</label>
                    <select name="orientation" class="form-control">
                        <option>Landscape</option>
                        <option>Portrait</option>
                    </select>
                </div>
                <div>
                    <label>Destination</label>
                    <select name="destination" class="form-control">
                        <option>MS Excel</option>
                        <option>PDF</option>
                    </select>
                </div>
                <div class="align-self-end">
                    <button type="submit" name="generate" value="1" class="btn btn-primary" style="margin-top:30px"><i class="fa fa-download"></i> Generate Report</button>
                </div>
            </div>
        </div>
    </form>
</div>

{% if messages %}
<script>
{% for message in messages %}
Swal.fire({icon: '{{ message.tags }}', title: '{{ message.tags|title }}', text: '{{ message }}', toast: true, position: 'top-end', timer: 3000});
{% endfor %}
</script>
{% endif %}
{% endblock %}
