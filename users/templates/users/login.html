{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isalu Hospital - Login Form </title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="{% static 'admin-img/myicon.ico' %}" type="image/x-icon" />
  <style>@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap");
    :root {
      --white-color: hsl(0,0%,100%);
      --black-color: hsl(0, 0% , 0%);
      --body-font:   "Poppins", sans-serif; 
      --h1-font-size: 1.75rem;
      --normal-font-size: 1rem;
      --small-font-size: .813rem;
       --font-medium: 500; 
       }

       *{
        box-sizing: border-box;
        padding: 0;
        margin: 0;
       }

       body,
       input,
       button {
        font-size:  var(--normal-font-size);
        font-family:  var(--body-font);
       }

       body {
        color:  var(--white-color);
       }

       input,
       button {
        border: none;
        outline: none;
       }

       a {
        text-decoration: none;
       }
         img {
          max-width: 100%;
          height: auto;
         }

         .login {
          position: relative;
          height: 100vh;
          display: grid;
          align-items: center;
         }

         .login__img {
          position: absolute;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
         }

         .login__div{
          display: none;
          margin-top: -40px;
         }

         .login__form {
          position: relative;
          background-color: hsla(0, 0%, 10%, 0.1);
          border: 2px solid var(--white-color);
          /*margin-inline: 1.5rem;
          padding: 1.5rem 1rem;*/
          border-radius: 1rem;
          backdrop-filter: blur(8px);
         }

         .login__title {
          text-align: center;
          font-size: var(--h1-font-size);
          font-weight: var(--font-medium);
          margin-bottom: 2rem;
         }
         .login__content, .login__box {
          display: grid;
         }

         .login__content {
          row-gap: 1.75rem;
          margin-bottom: 1.5rem;
         }

         .login__box {
          grid-template-columns: max-content 1fr;
          align-items: center;
          column-gap: 0.75rem;
          border-bottom: 2px solid var(--white-color);
         }
         .login__icon, .login__eye {
          font-size: 1.25rem;
         }
         .login__input {
          width: 100%;
          padding-block: 0.8rem;
          background: none;
          color:  var(--white-color);
          position: relative;
          font-weight: var(--font-medium);
          z-index: 1;
         }
         .login__box-input {
          position: relative;
         }
         input::placeholder{
              color: white; /* Replace with your desired color */
              opacity: 1;     /* Optional: make sure it's fully opaque */
}

         .login__label {
          position: absolute;
          left: 0;
          top: 13px;
          font-weight: var(--font-medium);
          transition: top 0.3s, font-size 0.3s;
         }
         .login__eye {
          position: absolute;
          right: 0;
          top: 18px;
          z-index: 10;
          cursor: pointer;
         }
         .login__box:nth-child(2) input {
          padding-right: 1.8rem;
         }

         .login__check, .login__check-group {
          display: flex;
          align-items: center;
          justify-content: space-between;
         }
         .login__check {
          margin-bottom: 1.5rem;
         }
          .login__check-label, .login__forgot, .login__register {
            font-size: var(--small-font-size);
          }
          .login__check-group {
            column-gap: 0.5rem;
          }
          .login__check-input {
            width: 16px;
            height: 16px;
          }
          .login__forgot {
            color: var(--white-color);
            }
            .login__forgot:hover {
              text-decoration: underline;
            }
            .login__button {
              width: 100%;
              padding: 1rem;
              border-radius: 0.5rem;
              background-color: var(--white-color);
              font-weight: var(--font-medium);
              cursor: pointer;
              margin-bottom: 2rem;
            }
            .login__register  {
                text-align: center ;
            }
            

            /* for medium devices */
            @media screen and (min-width: 576px) {
              .login {
                justify-content: center;
              }
              .login__form {
                width: 432px;
                padding: 4rem 3rem 3.5rem;
                border-radius: 1.5rem;
              }
              .login__title {
                font-size: 2rem;
              }
            }

                      /* Add Zoom Animation */
          .animate {
            -webkit-animation: animatezoom 2s;
            animation: animatezoom 2s
          }

          @-webkit-keyframes animatezoom {
            from {-webkit-transform: scale(0)}
            to {-webkit-transform: scale(1)}
          }

          @keyframes animatezoom {
            from {transform: scale(3)}
            to {transform: scale(1)}
}
  </style>
</head>
<body onload="loader1()">
      <div class="login">
        <img src="{% static '/admin-img/login-bg.png' %}" alt="login image" class="login__img">
        <div class="login__div" id="login__wrap">
        <form action="" class="login__form animate" method="POST">
          {% csrf_token %}
          {% if messages %}
            {% include 'users/message2.html' %}
          {% else %}
            <h1 class="login__title" style="font-family: cursive;">Login</h1>
          {% endif %}
          <div class="login__content">
            <div class="login__box">
              <i class="bx bx-lock-alt"></i>
              
              <div class="login__box-input">
                <input type="text" name="username" required class="login__input" placeholder="Username">
              </div>
            </div>

            <div class="login__box">
              <i class="ri-lock-2-line login__icon"></i>
              <div class="login__box-input">
                <input type="password" name="password" required class="login__input" id="login-pas" placeholder="Password">
                <i class="ri-eye-off-line login__eye"></i>
               </div>
            </div>
          </div>

          <div class="login__check">
            <div class="login__check-group">
              <input type="checkbox" class="login__check-input" id="show" onclick="changePassViewJS()">
              <label for="" class="login__check-label" id="chek">Show Password</label>
            </div>

              <a href="{% url 'reset_password' %}" class="login__forgot">Forgot Password?</a>
          </div>

          <button type="submit" class="login__button">Login</button>

          <p class="login__register">
            Don't have an account? &nbsp;<a href="{% url 'create_account' %}" style="color: #256fad; font-weight: bold;">Register</a>
          </p>
        </form>
      </div>
      
      </div>

      <!--<============ Main Js ============-->

      <script>/*--================== Show Hidden - Password =================*/
        function loader1() {
          document.getElementById('login__wrap').style.display='block';
        }
        function changePassViewJS(){
          let passView = document.getElementById("show").checked;
          let password = document.getElementById("login-pas");
          if(passView === true){
            password.setAttribute("type", "text");
            document.getElementById("chek").innerHTML = "<span>Hide Password<span>";
          }
          else{
            password.setAttribute("type", "password");
            document.getElementById("chek").innerHTML = "<span>Show Password<span>";
          }
      }
      </script>
</body>
</html>
