<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toast Demo</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <select id="categoryFilter" class="form-control mb-3">
    <option value="set">--Select Category--</option>
    <option value="Private">Private</option>
  </select>

  <input type="text" id="patientSearchInput" class="form-control" placeholder="Start typing to trigger toast...">
</div>

<!-- Toast HTML -->
<div id="categoryToast" class="toast align-items-center text-bg-warning border-0 position-fixed bottom-0 end-0 m-4"
     role="alert" aria-live="assertive" aria-atomic="true">
  <div class="d-flex">
    <div class="toast-body">
      ⚠️ Please select a category before searching.
    </div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS (bundle includes toast functionality) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {
    $('#patientSearchInput').on('input', function () {
        const category = $('#categoryFilter').val();
        if (category === "set") {
            const toastElement = document.getElementById('categoryToast');
            const toast = bootstrap.Toast.getOrCreateInstance(toastElement);
            toast.show();
        }
    });
});
</script>

</body>
</html>
