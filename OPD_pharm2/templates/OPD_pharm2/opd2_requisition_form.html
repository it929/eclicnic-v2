{% extends "admin.html" %}

{% block content %}

<div class="container-fluid">
    <!-- Page Heading -->
        <h1 class="h3 mb-1 text-primary font-weight-bold" style="color: rgb(42, 41, 41);" ><i class="fa fa-upload" ></i> &nbsp;From OPD Pharmacy 2 </h1>
      <p></p>
    
    <div class="mt-4">
        <div class="card">
            <div class="card-header">
                <h5>OPD <span style="text-decoration: underline; font-weight: bold;">Pharmacy 2</span> Product(s) Requisition</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive" style="padding-block: 10px; padding-inline: 30px;">
                    <table id="drug-table" class="table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>UoM</th>
                                <th>Qty.</th>
                                <th>Rate (₦)</th>
                                <th>Total (₦)</th>
                                <th>Add</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody id="drug-body">
                            <tr>
                                <td>
                                    <input list="drug-options" class="form-control drug-name">
                                    <datalist id="drug-options"></datalist>
                                </td> 
                                <td>
                                    <select class="form-control uom">
                                        <option value="ampoules">Ampoules</option><option value="bottles">Bottles</option><option value="boxes">Boxes</option>
                                        <option value="cartons">Cartons</option><option value="rolls">Rolls</option><option value="packs">Packs</option><option value="pieces">Pieces</option>
                                        <option value="prefilled_syringe">Prefilled Syringe</option><option value="sachets">Sachets</option><option value="syringes">Syringes</option>
                                        <option value="tins">Tins</option><option value="tubes">Tubes</option><option value="vial">Vial</option><option value="others">Others</option><option value="each">Each</option>
                                        <option value="mls">mls (mililiters)</option>
                                    </select>
                                </td>
                                <td><input type="number" class="form-control quantity" value="1" style="width: 60px;"></td>
                                <td><input type="text" class="form-control rate" readonly></td>
                                <td><input type="text" class="form-control total" readonly></td>
                                <td><button type="button" class="btn btn-success add-row">+</button></td>
                                <td><button type="button" class="btn btn-danger remove-row">-</button></td>
                            </tr>
                        </tbody>
                    </table>
                    <button type="button" id="submitDrugs" class="btn btn-primary">Send Products <i class="fa fa-arrow-right"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
    const datalist = document.getElementById("drug-options");

    // Fetch drug list dynamically
    async function fetchDrugs(term) {
        const response = await fetch(`/api/product-search2/?term=${term}`);
        const data = await response.json();
        datalist.innerHTML = ""; 
        data.forEach(item => {
            const option = document.createElement("option");
            option.value = item.product_name;
            option.dataset.id = item.id;
            option.dataset.price = item.price;
            option.dataset.stock = item.stock; 
            datalist.appendChild(option);
        });
    }

    // Attach drug listeners (for autocomplete & price update)
    function attachDrugListeners(input) {
        input.addEventListener("input", function () {
            if (this.value.length >= 1) {
                fetchDrugs(this.value);
            }
        });

        input.addEventListener("change", function () {
            const match = [...datalist.options].find(opt => opt.value === this.value);
            if (match) {
                const row = this.closest("tr");
                this.dataset.id = match.dataset.id;
                this.dataset.stock = match.dataset.stock; 
                row.querySelector(".rate").value = match.dataset.price;
                const qtyInput = row.querySelector(".quantity");
                qtyInput.value = 1;
                qtyInput.dataset.maxStock = match.dataset.stock; 
                calculateRowTotal(row);
            }
        });
    }

    // Calculate row total (quantity * rate)
    function calculateRowTotal(row) {
        const qty = parseFloat(row.querySelector(".quantity").value) || 0;
        const rate = parseFloat(row.querySelector(".rate").value) || 0;
        row.querySelector(".total").value = (qty * rate).toFixed(2);
    }

    // Attach quantity listeners so total updates on change
    function attachQuantityListener(input) {
        input.addEventListener("input", function () {
            const row = this.closest("tr");
            const maxStock = parseInt(this.dataset.maxStock) || 0; // 👈 NEW
            const enteredQty = parseInt(this.value) || 0;

            if (maxStock && enteredQty > maxStock) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Stock Limit Reached',
                    text: `Only ${maxStock} units available in stock!`,
                    confirmButtonText: 'Okay',
                });
                this.value = maxStock;
            }

            calculateRowTotal(row);
        });
    }

    // Attach listeners to existing row on load
    attachDrugListeners(document.querySelector(".drug-name"));
    attachQuantityListener(document.querySelector(".quantity"));

    // Handle add/remove row buttons
    document.addEventListener("click", function (e) {
        if (e.target.classList.contains("add-row")) {
            const tableBody = document.getElementById("drug-body");
            const newRow = tableBody.rows[0].cloneNode(true);

            // Reset values
            newRow.querySelectorAll("input").forEach(inp => {
                inp.value = "";
                inp.removeAttribute("data-id");
                inp.removeAttribute("data-stock");
                inp.removeAttribute("data-max-stock");
            });
            newRow.querySelectorAll("select").forEach(sel => sel.selectedIndex = 0);

            tableBody.appendChild(newRow);

            // Reattach listeners for the new row
            attachDrugListeners(newRow.querySelector(".drug-name"));
            attachQuantityListener(newRow.querySelector(".quantity"));
        }

        if (e.target.classList.contains("remove-row")) {
            const row = e.target.closest("tr");
            const tableBody = document.getElementById("drug-body");

            // Prevent removing the last row (must always have at least one)
            if (tableBody.rows.length > 1) {
                row.remove();
            } else {
                Swal.fire({
                    icon: 'info',
                    title: 'Action Not Allowed',
                    text: 'At least one row must remain.'
                });
            }
        }
    });

    document.getElementById("submitDrugs").addEventListener("click", async function () {
        const rows = document.querySelectorAll("#drug-body tr");
        let transactions = [];

        rows.forEach(row => {
            const productName = row.querySelector(".drug-name").value;
            const productId = row.querySelector(".drug-name").dataset.id;  
            const quantity = row.querySelector(".quantity").value;
            const rate = row.querySelector(".rate").value;
            const uom = row.querySelector(".uom").value;

            if (productId && quantity > 0) {
                transactions.push({
                    product_id: productId,
                    product_names: productName,
                    quantity: quantity,
                    price: rate,
                    minimum_UoM: uom,
                });
            }
        }); 

        if (transactions.length === 0) {
            Swal.fire({
                    icon: 'info',
                    title: 'Action Not Allowed',
                    text: 'No valid row to save, pls input data.'
                });
            return;
        }

        try {
            const response = await fetch("{% url 'save_opd2_requisition_form' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}",
                },
                body: JSON.stringify({ transactions: transactions }),
            });

            const data = await response.json();
            if (data.success) {
            Swal.fire({
                icon: 'success',
                title: 'Saved!',
                text: 'Product(s) requests successfully sent to the Inventory!',
                timer: 2000,
                showConfirmButton: false
                }).then(() => {
                    location.reload();
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Error saving transactions.'
                });
            }
            } catch (error) {
            console.error("Error:", error);
            Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Something went wrong.'
                });
        }
    });
});

</script>
{% endblock %}
