{% extends 'admin.html' %}

{% block content %}

<style>
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        padding-bottom: -10px;
        gap: 10px;
        font-size: 14px;
    }
</style>
<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800 font-weight-bold">
        <i class="fa fa-user-plus"></i> &nbsp;Ambulatory Visit Report
    </h1>
    <hr>
    <form method="get" id="reportForm">
        <div class="form-grid">
            <div>
                <div>
                    <label>Date From <span class="text-danger">*</span></label>
                    <input type="date" name="date_from" class="form-control" value="{{ request.GET.date_from }}" required>
                </div>
                <div>
                    <label>Date To</label>
                    <input type="date" name="date_to" class="form-control" value="{{ request.GET.date_to }}">
                </div>
                <div>
                    <label>Sponsor</label>
                    <select name="sponsor" class="form-control">
                        <option value="">All</option>
                        {% for s in sponsors %}<option value="{{ s.id }}" {% if request.GET.sponsor == s.id|stringformat:"s" %}selected{% endif %}>{{ s.plan }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Patient Type</label>
                    <select name="patient_type" class="form-control">
                        <option value="">All</option>
                        {% for pt in patient_types %}<option value="{{ pt.id }}" {% if request.GET.patient_type == pt.id|stringformat:"s" %}selected{% endif %}>{{ pt.category }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Purpose</label>
                    <input type="text" name="purpose" id="purposeInput" class="form-control" 
                        placeholder="Type 3+ letters... [default: All purposes]" 
                        value="{{ request.GET.purpose }}"
                        list="purposeList" autocomplete="off">
                    <datalist id="purposeList"></datalist>
                </div>
            </div>
            <div>
                <div>
                    <label>Visit Type</label>
                    <select name="visit_type" class="form-control">
                        <option value="">All</option>
                        {% for code, label in visit_types %}{% if code %}<option value="{{ code }}" {% if request.GET.visit_type == code %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Attendants</label>
                    <select name="registrar" class="form-control">
                        <option value="">All</option>
                        {% for r in registrars %}<option value="{{ r.id }}" {% if request.GET.registrar == r.id|stringformat:"s" %}selected{% endif %}>{{ r.fullname }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label>Orientation</label>
                    <select name="orientation" class="form-control">
                        <option>Landscape</option>
                        <option>Portrait</option>
                    </select>
                </div>
                <div>
                    <label>Destination</label>
                    <select name="destination" class="form-control">
                        <option>MS Excel</option>
                        <option>PDF</option>
                    </select>
                </div>
                <div class="align-self-end">
                    <button type="submit" name="generate" value="1" class="btn btn-primary"style="margin-top:30px"><i class="fa fa-download"></i> Generate Report</button>
                </div>
            </div>
        </div>
    </form>
</div>
<script>
// Passing all distinct purposes from Django to JS
const allPurposes = [
    {% for p in purposes %}{% if p %}'{{ p|escapejs }}',{% endif %}{% endfor %}
];

const purposeInput = document.getElementById('purposeInput');
const purposeList = document.getElementById('purposeList');

purposeInput.addEventListener('input', function() {
    const val = this.value;
    purposeList.innerHTML = ''; 
    
    if (val.length>= 3) {
        const filtered = allPurposes.filter(p => 
            p.toLowerCase().includes(val.toLowerCase())
        ).slice(0, 10); // limit to 10 suggestions
        
        filtered.forEach(p => {
            const option = document.createElement('option');
            option.value = p;
            purposeList.appendChild(option);
        });
    }
});

// Prevent form submit if date_from empty
document.getElementById('reportForm').addEventListener('submit', function(e) {
    if (!document.querySelector('input[name="date_from"]').value) {
        e.preventDefault();
        Swal.fire({
            icon: 'error',
            title: 'Date Required',
            text: 'Please select a "Date From" before generating.',
            toast: true,
            position: 'top-end'
        });
    }
});
</script>

{% if messages %}
<script>
{% for message in messages %}
Swal.fire({icon: '{{ message.tags }}', title: '{{ message.tags|title }}', text: '{{ message }}', toast: true, position: 'top-end', timer: 3000});
{% endfor %}
</script>
{% endif %}
{% endblock %}
